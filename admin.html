<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin - Puerto Hype</title>
  <link rel="stylesheet" href="css/admin.css?v=3">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="admin-header">
    <h1>Panel Admin</h1>
    <p class="admin-subtitle">Puerto Hype Management</p>
  </div>

  <!-- Login Container -->
  <div class="container" id="login-container">
    <div id="login-alert" class="alert alert-error hidden"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Correo</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" id="btn-login">Entrar al Panel</button>
    </form>
  </div>

  <!-- Main Admin Dashboard -->
  <div class="container admin-main hidden" id="admin-container">
    <div id="admin-alert" class="alert hidden"></div>

    <!-- Navigation Tabs -->
    <div class="admin-tabs">
      <button type="button" class="tab-btn active" id="tab-btn-add">➕ Agregar Producto</button>
      <button type="button" class="tab-btn" id="tab-btn-stock">📦 Ver / Editar Stock</button>
    </div>

    <!-- TAB 1: Add Product Form -->
    <section id="tab-content-add" class="tab-content">
      <form id="product-form">
        <label>Fotos del Producto</label>
        <div class="image-preview-container" id="image-preview-box">
          <span id="image-placeholder">📸 Toca para subir fotos (puedes seleccionar varias)<br><span>Se comprimen solas</span></span>
          <img id="image-preview" alt="Preview">
        </div>
        <input type="file" id="product-image" accept="image/*" multiple required>

        <div class="form-group">
          <label for="product-name">Nombre del Producto</label>
          <input type="text" id="product-name" placeholder="Ej: Jordan 1 Low Travis Scott" required>
        </div>
        
        <div class="form-group">
          <label for="product-price">Precio de Venta (MXN)</label>
          <input type="number" id="product-price" placeholder="Ej: 1400" required>
        </div>
        
        <div class="form-group">
          <label for="product-sizes">Tallas Disponibles (Separadas por coma)</label>
          <input type="text" id="product-sizes" placeholder="Ej: 26, 26.5, 27, 28">
        </div>

        <button type="submit" id="btn-save">Guardar Producto en Stock</button>
      </form>
    </section>

    <!-- TAB 2: Manage Stock Products -->
    <section id="tab-content-stock" class="tab-content hidden">
      <div class="stock-header">
        <input type="text" id="stock-search" placeholder="🔍 Buscar producto en stock..." class="search-input">
        <button type="button" id="btn-refresh-stock" class="btn-secondary-sm">🔄 Recargar</button>
      </div>

      <div id="admin-product-list" class="admin-product-list">
        <p style="text-align: center; color: #888;">Cargando inventario de stock...</p>
      </div>
    </section>

    <button type="button" id="btn-logout" class="btn-logout">Cerrar Sesión</button>
  </div>

  <script src="js/admin.js?v=3"></script>
</body>
</html>
